logging:
  level:
    org:
      yjhking:
        pethome: trace
mybatis:
  type-aliases-package: org.yjhking.pethome.*.domain,org.yjhking.pethome.*.query
#rocketmq配置信息
rocketmq:
  #nameservice服务器地址（多个以英文逗号隔开）
  name-server: 127.0.0.1:9876
  #生产者配置
  producer:
    #组名
    group: anran-producer-group
    #目的地（topic:tag）
    #topic
    topic: anran-topic
    #sync tag(同步消息tag)
    sync-tag: anran-sync-tags
    #async tag(异步消息tag)
    async-tag: anran-async-tags
    #oneway tag(单向消息tag)
    oneway-tag: anran-oneway-tags
server:
  port: 8080
  servlet:
    context-path: /
spring:
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    password: '${DB_PWD}'
    url: '${DB_URL}'
    username: '${DB_USER:root}'
  mail:
    host: '${MAIL_HOST:smtp.qq.com}'
    password: '${MAIL_PWD:}'
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    username: '${MAIL_USER:}'
  redis:
    database: '${REDIS_DATABASE:0}'
    host: '${REDIS_HOST:localhost}'
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        max-wait: 2000ms
        min-idle: 2
    password: '${REDIS_PWD:}'
    port: '${REDIS_PORT:6379}'